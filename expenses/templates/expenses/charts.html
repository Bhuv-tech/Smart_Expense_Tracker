<!DOCTYPE html>
<html>
<head>
    <title>Expense Charts</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #7ad3e4, #e5e7eb);
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .chart-container {
            width: 250px;   /* control size here */
            height: 250px;
            margin: 20px auto;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            font-weight: 600;
            color: #041214;
        }
    </style>
</head>
<body>

<h1>📊 Expense Analytics</h1>

<div class="chart-container">
    <canvas id="categoryChart"></canvas>
</div>

<div class="chart-container">
    <canvas id="monthlyChart"></canvas>
</div>

<script id="chart-data" type="application/json">
{
    "categories": {{ categories|safe }},
    "category_totals": {{ category_totals|safe }},
    "months": {{ months|safe }},
    "month_totals": {{ month_totals|safe }}
}
</script>

<script>
    const chartData = JSON.parse(
        document.getElementById('chart-data').textContent
    );

    new Chart(document.getElementById('categoryChart'), {
        type: 'pie',
        data: {
            labels: chartData.categories,
            datasets: [{
                data: chartData.category_totals,
                backgroundColor: ['red','teal','green','orange','purple']
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });

    new Chart(document.getElementById('monthlyChart'), {
        type: 'bar',
        data: {
            labels: chartData.months,
            datasets: [{
                label: 'Monthly Expense',
                data: chartData.month_totals
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });
</script>

<a class="back-link" href="{% url 'expense_list' %}">⬅ Back to Expenses</a>

</body>
</html>
