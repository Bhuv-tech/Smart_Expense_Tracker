<!DOCTYPE html>
<html>
<head>
    <title>Monthly Summary</title>
</head>
<body>

<h1>📊 Monthly Expense Summary</h1>

<h2>Current Month Total</h2>
<p>
    ₹ {{ monthly_total|default:"0" }}
</p>

<hr>

<h2>Month-wise Breakdown</h2>

<table border="1" cellpadding="5">
    <tr>
        <th>Month</th>
        <th>Total Expense</th>
    </tr>

    {% for item in month_expenses %}
    <tr>
        <td>{{ item.date__month }}</td>
        <td>₹ {{ item.total }}</td>
    </tr>
    {% endfor %}
</table>

<br>
<a href="{% url 'expense_list' %}">⬅ Back to Expenses</a>

</body>
</html>
