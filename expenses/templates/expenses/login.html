{% extends 'base.html' %}

{% block content %}

<h2>Login</h2>

<form method="POST" class="card p-4 shadow-sm col-md-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary">Login</button>
</form>

<p class="mt-3">
    New user? <a href="{% url 'signup' %}">Create account</a>
</p>

{% endblock %}
